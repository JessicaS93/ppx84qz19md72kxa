<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnóstico — Proyección Diaria</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f}
main{max-width:640px;margin:auto;padding:24px 16px 48px}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 18px #00000010}
h1{font-size:28px;margin:0 0 8px}.muted{color:#6e6e73}
.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #eee}
.ok{color:#087f5b;font-weight:700}.bad{color:#c92a2a;font-weight:700}
a{display:inline-block;margin-top:18px;text-decoration:none;background:#d10072;color:white;padding:12px 16px;border-radius:12px;font-weight:700}
</style>
</head>
<body><main>
<div class="card">
<h1>Diagnóstico</h1>
<p class="muted">Esta página confirma las funciones necesarias para leer el Excel y calcular sin redondeo interno.</p>
<div id="checks"></div>
<a href="./">Volver a la aplicación</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
const checks=[
 ['Lector de archivos',typeof FileReader!=='undefined'],
 ['Cálculos exactos BigInt',typeof BigInt!=='undefined'],
 ['Descompresión Excel',typeof DecompressionStream!=='undefined'||(window.fflate&&typeof window.fflate.unzipSync==='function')],
 ['Almacenamiento temporal',typeof sessionStorage!=='undefined'],
 ['Modo aplicación',window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true],
 ['Service Worker','serviceWorker' in navigator]
];
document.getElementById('checks').innerHTML=checks.map(([name,ok])=>
 '<div class="row"><span>'+name+'</span><span class="'+(ok?'ok':'bad')+'">'+(ok?'Disponible':'No disponible')+'</span></div>'
).join('');
</script>
</main></body></html>
